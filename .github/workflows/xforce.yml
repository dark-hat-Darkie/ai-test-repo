name: X-Force Pipeline

on:
  issues:
    types: [labeled]

jobs:
  xforce:
    if: github.event.label.name == 'xforce:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run X-Force Pipeline
        uses: dark-hat-Darkie/x-force/actions/run-pipeline@master
        with:
          issue_number: ${{ github.event.issue.number }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
