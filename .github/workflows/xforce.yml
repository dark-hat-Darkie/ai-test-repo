name: X-Force Pipeline

on:
  issues:
    types: [labeled]

jobs:
  xforce:
    if: github.event.label.name == 'xforce:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install X-Force
        run: npm install -g x-force@latest

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run X-Force Pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xforce run \
            --repo "your-org/ai-test-repo" \
            --issue-number "${{ github.event.issue.number }}"
